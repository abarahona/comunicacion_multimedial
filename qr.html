<!DOCTYPE html>
<html lang="es-ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso por QR · Capacitación Ciudadano Digital</title>
  <meta name="description" content="Código QR para ingresar a la capacitación de Ciudadano Digital.">
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2336CA70'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M6 26c0-5 4.5-8 10-8s10 3 10 8' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="tema.js"></script>
  <script src="accesibilidad.js"></script>

  <style>
    .qr-hero {
      text-align: center;
    }

    .qr-hero p {
      margin-left: auto;
      margin-right: auto;
    }

    .qr-contenido {
      max-width: 620px;
    }

    .qr-tarjeta {
      text-align: center;
    }

    .qr-caja {
      display: inline-block;
      padding: 18px;
      background: #FFFFFF;
      border: 1px solid var(--borde);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(55, 64, 80, .14);
    }

    .qr-caja img {
      display: block;
      width: min(320px, 68vw);
      height: auto;
      image-rendering: pixelated;
    }

    .qr-url {
      display: block;
      margin: 20px 0 22px;
      color: var(--gris);
      font-size: .95rem;
      word-break: break-all;
    }

    .qr-nota {
      margin: 18px 0 0;
      color: var(--gris);
      font-size: .85rem;
    }
  </style>
</head>

<body>

  <header class="modulo-header">
    <div class="contenedor">
      <a class="modulo-volver" href="index.html">
        ← Volver al inicio
      </a>
    </div>
  </header>

    <section class="modulo-hero qr-hero">

        <span class="modulo-etiqueta">
          Capacitación CiDi
        </span>

        <h1>Ingresá a la capacitación</h1>

        <p>
          Escaneá el código QR con la cámara de tu celular para abrir la página
          de Ciudadano Digital.
        </p>
      </div>
    </section>

    <div class="modulo-contenido qr-contenido">

        <a class="qr-url" href="https://abarahona.github.io/comunicacion_multimedial/" target="_blank" rel="noopener">
          https://abarahona.github.io/comunicacion_multimedial/
        </a>

        <a class="btn btn-primario" href="https://abarahona.github.io/comunicacion_multimedial/" target="_blank" rel="noopener">
          Abrir la página →
        </a>

    </div>

</html>
